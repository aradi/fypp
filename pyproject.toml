[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fypp"
version = "3.2"
dependencies = []
requires-python = ">=3.7"
authors = [{name = "Bálint Aradi", email = "aradi@uni-bremen.de"},]
maintainers = [{name = "Bálint Aradi", email = "aradi@uni-bremen.de"},]
description = "Python powered Fortran preprocessor"
readme = "README.rst"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
keywords = ["fortran", "meta-programming", "preprocessor"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://fypp.readthedocs.io"
Documentation = "https://fypp.readthedocs.io/en/latest/"
Repository = "https://github.com/aradi/fypp.git"
Changelog = "https://github.com/aradi/fypp/blob/main/CHANGELOG.rst"

[project.scripts]
fypp = "fypp:run_fypp"

# Hatch builder settings

[tool.hatch.build.targets.wheel]
packages = ["src/fypp.py"]

[tool.hatch.build.targets.sdist]
include = ["src", "test"]

# Tox settings

[tool.tox]
requires = ["tox>=4.40"]
env_list = ["3.15", "3.14", "3.13", "3.12", "3.11", "3.10", "3.9"]

[tool.tox.env_run_base]
description = "Run unit tests across Python environments"
skip_missing_interpreters = true
package = "sdist-wheel"
wheel_build_env = ".pkg"
changedir = "{tox_root}/test"
commands= [
    ["python3", "-m", "unittest", "discover"]
]
